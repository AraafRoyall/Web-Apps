<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Emoji Key Generator</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff;color:#17211d}
.app{width:100%;height:100dvh;display:flex;flex-direction:column;padding:16px 16px 84px}
.header{flex:none;margin-bottom:12px}
.title{margin:0;font-size:25px;font-weight:850;letter-spacing:-.5px;color:#087f5b}
.subtitle{margin:4px 0 0;font-size:13px;color:#74817b}
.info-card{flex:none;border:1px solid #e6ece9;border-radius:17px;background:#fff;padding:14px;box-shadow:0 5px 18px rgba(20,60,45,.06)}
.info-row{display:flex;justify-content:space-between;align-items:center}
.info-title{font-size:14px;font-weight:800;color:#34463e}
.badge{background:#e9f8f3;color:#087f5b;padding:6px 9px;border-radius:20px;font-size:11px;font-weight:800}
.info-text{margin-top:8px;font-size:12px;color:#7a8781;line-height:1.45}
.controls{display:flex;gap:9px;flex:none;margin:12px 0}
.action{flex:1;border:1px solid transparent;border-radius:12px;padding:11px 8px;font-size:14px;font-weight:750;cursor:pointer}
.copy{background:#e9f8f3;color:#087f5b;border-color:#d7eee7}
.download{background:#fff4d8;color:#986500;border-color:#f5e6bb}
.json-card{min-height:0;flex:1;display:flex;flex-direction:column;border:1px solid #e6ece9;border-radius:17px;background:#fff;box-shadow:0 5px 18px rgba(20,60,45,.06);padding:12px}
.json-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.json-title{font-size:14px;font-weight:800;color:#31423a}
.json-badge{font-size:11px;font-weight:750;color:#1769aa;background:#e9f3fb;border-radius:20px;padding:5px 8px}
pre{margin:0;flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;white-space:pre-wrap;word-break:break-word;background:#f7faf9;border:1px solid #e8efec;border-radius:13px;padding:12px;font-family:"SFMono-Regular",Consolas,monospace;font-size:12px;line-height:1.5;color:#29352f}
.fab{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:calc(100% - 32px);max-width:420px;height:52px;border:none;border-radius:17px;color:#fff;font-size:15px;font-weight:800;letter-spacing:.1px;cursor:pointer;background:#0f9f73;box-shadow:0 8px 22px rgba(15,118,110,.25),inset 0 1px 1px rgba(255,255,255,.32)}
.overlay{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;background:rgba(15,30,24,.28);backdrop-filter:blur(4px);z-index:20}
.dialog{width:100%;max-width:440px;background:#fff;border-radius:24px 24px 0 0;padding:18px;box-shadow:0 -12px 35px rgba(0,0,0,.16);animation:slideUp .2s ease}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.dialog-title{font-size:20px;font-weight:850;color:#087f5b;margin-bottom:5px}
.dialog-subtitle{font-size:13px;color:#718078;margin-bottom:13px}
.name-input{width:100%;border:1.5px solid #dce7e2;border-radius:13px;padding:12px;font-size:16px;outline:none;background:#fbfdfc}
.name-input:focus{border-color:#14b8a6}
.dialog-buttons{display:flex;gap:9px;margin-top:12px}
.dialog-buttons button{flex:1;border:none;border-radius:12px;padding:12px;font-size:14px;font-weight:750}
.cancel{background:#eef2f0;color:#50625a}.save{background:#1769aa;color:#fff}
#toast{position:fixed;left:50%;bottom:79px;transform:translateX(-50%) translateY(10px);background:#146c57;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.22s;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.15)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1 class="title">Emoji Key Generator</h1>
    <div class="subtitle">Generate a random emoji mapping instantly.</div>
  </div>

  <div class="info-card">
    <div class="info-row">
      <div class="info-title">Emoji Pool</div>
      <div class="badge" id="poolBadge">Loading...</div>
    </div>
    <div class="info-text">Built-in Emoji Pool is loaded from the server.</div>
  </div>

  <div class="controls">
    <button class="action copy" onclick="copyJSON()">Copy JSON</button>
    <button class="action download" onclick="openDownload()">Export JSON</button>
  </div>

  <div class="json-card">
    <div class="json-header">
      <div class="json-title">Generated JSON</div>
      <div class="json-badge" id="status">Not generated</div>
    </div>
    <pre id="output">Press Generate New to create your emoji mapping.</pre>
  </div>
</div>

<button class="fab" onclick="generate()">＋ Generate New</button>

<div class="overlay" id="downloadOverlay" onclick="outsideDialog(event)">
  <div class="dialog">
    <div class="dialog-title">Export JSON</div>
    <div class="dialog-subtitle">Choose a filename for your emoji mapping.</div>
    <input class="name-input" id="fileName" type="text" value="emoji-map" placeholder="File name">
    <div class="dialog-buttons">
      <button class="cancel" onclick="closeDownload()">Cancel</button>
      <button class="save" onclick="downloadJSON()">Download</button>
    </div>
  </div>
</div>

<div id="toast">Copied!</div>

<script>
let currentJSON="";
let EMOJIS=[];
const output=document.getElementById("output");
const status=document.getElementById("status");
const poolBadge=document.getElementById("poolBadge");

function getEmojis(text){
  if(typeof Intl!=="undefined"&&Intl.Segmenter){
    const s=new Intl.Segmenter(undefined,{granularity:"grapheme"});
    return [...s.segment(text)].map(x=>x.segment).filter(x=>/\p{Extended_Pictographic}/u.test(x));
  }
  return Array.from(text).filter(x=>/\p{Extended_Pictographic}/u.test(x));
}

async function loadPool(){
  try{
    const r=await fetch("EmojiPool.txt",{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const text=await r.text();
    EMOJIS=[...new Set(getEmojis(text))];
    poolBadge.textContent=EMOJIS.length+" emojis";
    if(EMOJIS.length<102){
      poolBadge.textContent="Too small";
      showToast("EmojiPool.txt needs more emojis");
    }
  }catch(e){
    EMOJIS=[];
    poolBadge.textContent="Load failed";
    output.textContent="Unable to load EmojiPool.txt.\n\nKeep EmojiPool.txt in the same folder as index.html.";
    status.textContent="Pool error";
    showToast("Could not load EmojiPool.txt");
  }
}

function generate(){
  const keys=[];
  for(let i=65;i<=90;i++)keys.push(String.fromCharCode(i));
  for(let i=97;i<=122;i++)keys.push(String.fromCharCode(i));
  for(let i=48;i<=57;i++)keys.push(String.fromCharCode(i));
  keys.push("=","/","#","-","+","*","_","@","&","%",".","?");

  if(EMOJIS.length<keys.length){
    showToast("Not enough unique emojis");
    return;
  }

  const pool=[...EMOJIS];
  shuffle(pool);
  const map={};
  keys.forEach((key,i)=>map[key]=pool[i]);
  currentJSON=JSON.stringify(map,null,4);
  output.textContent=currentJSON;
  status.textContent=keys.length+" keys";
  showToast("New mapping generated");
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

async function copyJSON(){
  if(!currentJSON){showToast("Generate JSON first");return}
  try{
    await navigator.clipboard.writeText(currentJSON);
  }catch(e){
    const ta=document.createElement("textarea");
    ta.value=currentJSON;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
  }
  showToast("JSON copied");
}

function openDownload(){
  if(!currentJSON){showToast("Generate JSON first");return}
  document.getElementById("downloadOverlay").style.display="flex";
  setTimeout(()=>{
    const i=document.getElementById("fileName");
    i.focus();i.select();
  },100);
}

function closeDownload(){
  document.getElementById("downloadOverlay").style.display="none";
}

function outsideDialog(e){
  if(e.target.id==="downloadOverlay")closeDownload();
}

function downloadJSON(){
  let name=document.getElementById("fileName").value.trim()||"emoji-map";
  name=name.replace(/[<>:"/\\|?*]/g,"_");
  if(!name.toLowerCase().endsWith(".json"))name+=".json";

  const blob=new Blob([currentJSON],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  URL.revokeObjectURL(url);
  closeDownload();
  showToast("JSON downloaded");
}

function showToast(message){
  const t=document.getElementById("toast");
  t.textContent=message;
  t.classList.add("show");
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>t.classList.remove("show"),1600);
}

loadPool();
</script>
</body>
</html>
