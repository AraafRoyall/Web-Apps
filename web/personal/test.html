function icon(name,size=20){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]||ICONS.book}</svg>`}
const uid=()=>`id_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,8)}`;
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const moneyRaw=(n)=>Number(n||0);
let db=loadDB();
let activeTab='home',selectedPartyId=null,partyFilter='all',partySearch='',reportPeriod='month',modalState=null,toastTimer=null;
function freshDB(){return {version:1,profile:{businessName:'My Hisab',ownerName:'',phone:'',currency:'INR'},parties:[],transactions:[],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()}}
function loadDB(){try{const raw=localStorage.getItem(DB_KEY);if(!raw)return freshDB();const x=JSON.parse(raw);if(!x||!Array.isArray(x.parties)||!Array.isArray(x.transactions)||!x.profile)throw Error('bad data');x.version=1;x.profile.currency=x.profile.currency||'INR';return x}catch(e){return freshDB()}}
function saveDB(){db.updatedAt=new Date().toISOString();try{localStorage.setItem(DB_KEY,JSON.stringify(db));return true}catch(e){toast('Could not save. Browser storage may be full.');return false}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(n,compact=false){const c=db.profile.currency||'INR';try{return new Intl.NumberFormat('en-IN',{style:'currency',currency:c,maximumFractionDigits:compact?0:2,minimumFractionDigits:compact?0:2}).format(Number(n)||0)}catch(e){return '₹'+(Number(n)||0).toFixed(compact?0:2)}}
function fmtDate(v,options={day:'numeric',month:'short',year:'numeric'}){if(!v)return '—';const d=new Date(v+'T12:00:00');return isNaN(d)?v:d.toLocaleDateString('en-IN',options)}
function shortDate(v){return fmtDate(v,{day:'numeric',month:'short'})}
function monthKey(v){return String(v||'').slice(0,7)}
function partyById(id){return db.parties.find(p=>p.id===id)}
function txnsFor(id){return db.transactions.filter(t=>!id||t.partyId===id)}
function balanceFor(id){return txnsFor(id).reduce((sum,t)=>sum+(t.type==='gave'?moneyRaw(t.amount):-moneyRaw(t.amount)),0)}
function totalGiven(id,txns=db.transactions){return txns.filter(t=>(!id||t.partyId===id)&&t.type==='gave').reduce((a,t)=>a+moneyRaw(t.amount),0)}
function totalGot(id,txns=db.transactions){return txns.filter(t=>(!id||t.partyId===id)&&t.type==='got').reduce((a,t)=>a+moneyRaw(t.amount),0)}
function totals(){const balances=db.parties.map(p=>balanceFor(p.id));return {receivable:balances.reduce((s,b)=>s+Math.max(0,b),0),payable:balances.reduce((s,b)=>s+Math.max(0,-b),0),given:totalGiven(),got:totalGot(),parties:db.parties.length,entries:db.transactions.length,net:balances.reduce((s,b)=>s+b,0)}}
function initials(name){const parts=String(name||'?').trim().split(/\s+/).filter(Boolean);return (parts.length>1?parts[0][0]+parts[parts.length-1][0]:String(parts[0]||'?').slice(0,2)).toUpperCase()}
function avatarClass(p){const b=balanceFor(p.id);return b<0?'amber':(b===0?'blue':'')}
function balanceLabel(b){return b>0?'They owe you':b<0?'You owe them':'Settled'}
function balanceClass(b){return b>0?'amount-green':b<0?'amount-blue':'amount-muted'}
function balancePill(b){return b>0?'green':b<0?'blue':'amber'}
function noPartiesHTML(){return `<div class="empty"><div class="empty-illustration">${icon('users',27)}</div><h3>Your ledger starts here</h3><p>Add a customer, supplier, friend or business. Then record money you gave or received and the balance stays updated.</p><button class="primary-btn" data-action="open-party">${icon('plus',16)} Add your first party</button></div>`}
function navHTML(){const items=[['home','Home','home'],['parties','Parties','users'],['reports','Reports','chart'],['settings','Settings','settings']];return items.map(([id,label,ic])=>`<button class="nav-btn ${activeTab===id&&!selectedPartyId?'active':''}" data-tab="${id}">${icon(ic,21)}<span>${label}</span></button>`).join('')}
function homeHTML(){const t=totals(),recent=[...db.transactions].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||String(b.createdAt||'').localeCompare(String(a.createdAt||''))).slice(0,5);const date=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'});return `
<div class="page-heading"><div><div class="eyebrow">${esc(date)}</div><h1>Good ${new Date().getHours()<12?'morning':new Date().getHours()<17?'afternoon':'evening'} 👋</h1><p>Every account, clear and in control.</p></div><span class="pill green">${icon('shield',12)} Private</span></div>
<section class="hero"><div class="hero-top"><span>NET LEDGER BALANCE</span><span class="period">${icon('calendar',13)} All time</span></div><div class="hero-balance">${fmt(t.receivable-t.payable,true)}</div><div class="hero-caption">Receivables minus payables · Your overall position</div><div class="hero-foot"><div class="hero-mini"><span class="hero-mini-icon">${icon('up',17)}</span><div><small>To receive</small><strong>${fmt(t.receivable,true)}</strong></div></div><div class="hero-divider"></div><div class="hero-mini"><span class="hero-mini-icon">${icon('down',17)}</span><div><small>To pay</small><strong>${fmt(t.payable,true)}</strong></div></div></div></section>
<div class="stat-grid"><div class="stat-card"><div class="stat-head"><span>Parties</span><span class="stat-icon green">${icon('users',17)}</span></div><div class="stat-value">${t.parties}</div><div class="stat-note">People & businesses</div></div><div class="stat-card"><div class="stat-head"><span>Entries recorded</span><span class="stat-icon amber">${icon('book',17)}</span></div><div class="stat-value">${t.entries}</div><div class="stat-note">Your transaction history</div></div></div>
<div class="section-head"><h2>Quick actions</h2></div><div class="quick-grid"><button class="quick-btn" data-action="open-entry"><span class="quick-icon teal">${icon('plus',21)}</span><span><span class="quick-title">Add entry</span><span class="quick-sub" style="display:block">Record a transaction</span></span></button><button class="quick-btn" data-action="open-party"><span class="quick-icon amber">${icon('users',21)}</span><span><span class="quick-title">Add party</span><span class="quick-sub" style="display:block">New account</span></span></button></div>
<div class="section-head"><h2>Recent activity</h2><button class="text-btn" data-tab="parties">View ledgers ${icon('arrow',13)}</button></div>
${recent.length?`<div class="list">${recent.map(txnRowHTML).join('')}</div>`:`<div class="empty"><div class="empty-illustration">${icon('sparkle',27)}</div><h3>A clean start</h3><p>Your entries will appear here. Add a party first, or record your first transaction.</p><button class="secondary-btn" data-action="open-party">${icon('plus',15)} Create party</button></div>`}
<div class="footer-note">Your data stays in this browser. Export a JSON backup regularly to keep a copy.</div>`}
function partyRowHTML(p){const b=balanceFor(p.id);return `<button class="party-row" data-open-party="${esc(p.id)}"><span class="avatar ${avatarClass(p)}">${esc(initials(p.name))}</span><span class="row-main"><span class="row-name">${esc(p.name)}</span><span class="row-sub">${esc(p.phone||(p.group==='supplier'?'Supplier':p.group==='customer'?'Customer':'Other'))}</span></span><span class="row-right"><span class="row-amount ${balanceClass(b)}">${fmt(Math.abs(b),true)}</span><span class="row-label">${esc(balanceLabel(b))}</span></span></button>`}
function txnRowHTML(t,showDelete=false){const p=partyById(t.partyId);return `<div class="txn-row"><span class="txn-left-icon ${t.type==='gave'?'gave':'got'}">${icon(t.type==='gave'?'up':'down',17)}</span><span class="row-main"><span class="row-name">${esc(p?p.name:'Deleted party')}</span><span class="row-sub">${esc(t.type==='gave'?'You gave':'You got')}${t.note?' · '+esc(t.note):''} · ${esc(shortDate(t.date))}</span></span><span class="row-right"><span class="row-amount ${t.type==='gave'?'amount-green':'amount-blue'}">${t.type==='gave'?'+':'−'}${fmt(moneyRaw(t.amount),true)}</span><span class="row-label">${esc(t.method||'Cash')}</span></span>${showDelete?`<button class="delete-mini" data-action="delete-txn" data-id="${esc(t.id)}" aria-label="Delete entry">${icon('trash',15)}</button>`:''}</div>`}
function partiesHTML(){let list=[...db.parties];if(partySearch.trim()){const q=partySearch.toLowerCase().trim();list=list.filter(p=>`${p.name} ${p.phone||''} ${p.group||''}`.toLowerCase().includes(q))}list=list.filter(p=>{const b=balanceFor(p.id);return partyFilter==='all'||(partyFilter==='receivable'&&b>0)||(partyFilter==='payable'&&b<0)||(partyFilter==='settled'&&b===0)});list.sort((a,b)=>a.name.localeCompare(b.name));const t=totals();return `<div class="page-heading"><div><div class="eyebrow">ACCOUNT DIRECTORY</div><h1>Parties</h1><p>All your people and business accounts.</p></div><button class="icon-btn" data-action="open-party" title="Add party">${icon('plus',19)}</button></div>
<div class="search-box">${icon('search',19)}<input id="partySearch" value="${esc(partySearch)}" placeholder="Search name, phone or account…" autocomplete="off"></div>
<div class="filters">${[['all','All'],['receivable','They owe'],['payable','You owe'],['settled','Settled']].map(([v,l])=>`<button class="filter-btn ${partyFilter===v?'active':''}" data-party-filter="${v}">${l}${v==='all'?' · '+t.parties:''}</button>`).join('')}</div>
<div class="inline-summary"><small>${list.length} ${list.length===1?'account':'accounts'} shown</small><strong>${fmt(list.reduce((s,p)=>s+Math.abs(balanceFor(p.id)),0),true)} <span style="font-size:9px;font-weight:700">combined balance</span></strong></div>
${list.length?`<div class="list">${list.map(partyRowHTML).join('')}</div>`:(db.parties.length?`<div class="empty"><div class="empty-illustration">${icon('search',27)}</div><h3>No matching accounts</h3><p>Try another search or change the balance filter.</p><button class="secondary-btn" data-action="clear-party-search">Clear filters</button></div>`:noPartiesHTML())}
<div class="footer-note">Tap an account to open its full ledger and record entries.</div>`}
function partyDetailHTML(){const p=partyById(selectedPartyId);if(!p){selectedPartyId=null;return partiesHTML()}const b=balanceFor(p.id),list=txnsFor(p.id).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||String(b.createdAt||'').localeCompare(String(a.createdAt||'')));let grouped={};list.forEach(t=>(grouped[t.date||'No date']||(grouped[t.date||'No date']=[])).push(t));const rows=Object.keys(grouped).map(d=>`<div class="ledger-date">${esc(fmtDate(d))}</div><div class="list">${grouped[d].map(t=>txnRowHTML(t,true)).join('')}</div>`).join('');return `<button class="detail-back" data-action="back-parties">${icon('back',16)} All parties</button>
<div class="detail-person"><div class="avatar ${avatarClass(p)}">${esc(initials(p.name))}</div><h1>${esc(p.name)}</h1><p>${p.phone?`${icon('phone',12)} ${esc(p.phone)} · `:''}${esc((p.group||'other').charAt(0).toUpperCase()+(p.group||'other').slice(1))}</p><div class="balance-panel"><div class="label">CURRENT BALANCE</div><div class="balance ${balanceClass(b)}">${fmt(Math.abs(b))}</div><div class="note">${esc(balanceLabel(b))} · ${list.length} ${list.length===1?'entry':'entries'}</div></div><div class="detail-actions"><button class="primary-btn" data-action="open-entry" data-type="gave" data-party="${esc(p.id)}">${icon('up',17)} You gave</button><button class="secondary-btn" data-action="open-entry" data-type="got" data-party="${esc(p.id)}">${icon('down',17)} You got</button></div><div class="detail-metrics"><div class="detail-metric"><small>Total you gave</small><strong class="amount-green">${fmt(totalGiven(p.id),true)}</strong></div><div class="detail-metric"><small>Total you got</small><strong class="amount-blue">${fmt(totalGot(p.id),true)}</strong></div></div><div class="detail-actions"><button class="secondary-btn" data-action="edit-party" data-id="${esc(p.id)}">${icon('edit',16)} Edit party</button><button class="secondary-btn" data-action="share-party" data-id="${esc(p.id)}">${icon('share',16)} Share summary</button></div></div>
<div class="section-head"><h2>Ledger history</h2><span class="pill ${balancePill(b)}">${esc(balanceLabel(b))}</span></div>
${list.length?rows:`<div class="empty"><div class="empty-illustration">${icon('book',26)}</div><h3>No entries yet</h3><p>Record money you gave or received to start this party's ledger.</p><button class="primary-btn" data-action="open-entry" data-party="${esc(p.id)}">${icon('plus',16)} Add first entry</button></div>`}
<div style="margin-top:14px"><button class="danger-btn wide" data-action="delete-party" data-id="${esc(p.id)}">${icon('trash',16)} Delete party and its entries</button></div>`}
function reportsHTML(){const all=[...db.transactions];const selected=reportPeriod==='month'?all.filter(t=>monthKey(t.date)===today().slice(0,7)):all;const given=totalGiven(null,selected),got=totalGot(null,selected);const net=given-got;const labels=[];const now=new Date();for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);labels.push({key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,label:d.toLocaleDateString('en-IN',{month:'short'})})}const vals=labels.map(m=>({label:m.label,g:totalGiven(null,all.filter(t=>monthKey(t.date)===m.key)),r:totalGot(null,all.filter(t=>monthKey(t.date)===m.key))}));const max=Math.max(1,...vals.flatMap(v=>[v.g,v.r]));const chart=vals.map(v=>`<div class="bar-group"><div class="bars"><span class="bar gave" style="height:${Math.max(v.g?3:0,(v.g/max)*100)}px" title="You gave ${esc(fmt(v.g))}"></span><span class="bar got" style="height:${Math.max(v.r?3:0,(v.r/max)*100)}px" title="You got ${esc(fmt(v.r))}"></span></div><span class="bar-label">${esc(v.label)}</span></div>`).join('');const outstanding=[...db.parties].map(p=>({p,b:balanceFor(p.id)})).filter(x=>x.b!==0).sort((a,b)=>Math.abs(b.b)-Math.abs(a.b)).slice(0,5);const t=totals();return `<div class="page-heading"><div><div class="eyebrow">YOUR NUMBERS, AT A GLANCE</div><h1>Reports</h1><p>Understand movement and outstanding balances.</p></div></div>
<div class="report-toggle"><button class="${reportPeriod==='month'?'active':''}" data-report-period="month">This month</button><button class="${reportPeriod==='all'?'active':''}" data-report-period="all">All time</button></div>
<div class="report-card" style="margin-top:12px"><div class="split"><div><h3>${reportPeriod==='month'?'This month’s movement':'All-time movement'}</h3><p>You gave compared with you got</p></div><span class="stat-icon green">${icon('chart',17)}</span></div><div class="report-total">${fmt(net,true)}</div><p>${net>0?'More given than received in this period':net<0?'More received than given in this period':'Given and received are balanced in this period'}</p><div class="separator"></div><div class="report-line"><span>↗ You gave</span><strong class="amount-green">${fmt(given,true)}</strong></div><div class="report-line"><span>↘ You got</span><strong class="amount-blue">${fmt(got,true)}</strong></div></div>
<div class="report-card"><div class="split"><div><h3>Last 6 months</h3><p>Transaction volume by month</p></div><span class="pill blue">Trend</span></div><div class="bar-chart">${chart}</div><div class="legend"><span><i class="lg-g"></i>You gave</span><span><i class="lg-b"></i>You got</span></div></div>
<div class="stat-grid"><div class="stat-card"><div class="stat-head"><span>Still to receive</span><span class="stat-icon green">${icon('up',16)}</span></div><div class="stat-value">${fmt(t.receivable,true)}</div><div class="stat-note">Across all parties</div></div><div class="stat-card"><div class="stat-head"><span>Still to pay</span><span class="stat-icon blue">${icon('down',16)}</span></div><div class="stat-value">${fmt(t.payable,true)}</div><div class="stat-note">Across all parties</div></div></div>
<div class="section-head"><h2>Biggest outstanding</h2><button class="text-btn" data-tab="parties">All parties ${icon('arrow',13)}</button></div>${outstanding.length?`<div class="list">${outstanding.map(({p,b})=>`<button class="party-row" data-open-party="${esc(p.id)}"><span class="avatar ${avatarClass(p)}">${esc(initials(p.name))}</span><span class="row-main"><span class="row-name">${esc(p.name)}</span><span class="row-sub">${esc(balanceLabel(b))}</span></span><span class="row-right"><span class="row-amount ${balanceClass(b)}">${fmt(Math.abs(b),true)}</span><span class="row-label">Outstanding</span></span></button>`).join('')}</div>`:`<div class="empty"><div class="empty-illustration">${icon('check',26)}</div><h3>No outstanding balances</h3><p>Add ledger entries and your open balances will be summarized here.</p></div>`}
<div class="footer-note">Reports are calculated from the entries currently stored in this browser.</div>`}
function settingsHTML(){const prof=db.profile;return `<div class="page-heading"><div><div class="eyebrow">PREFERENCES & BACKUPS</div><h1>Settings</h1><p>Personalize your book and protect your records.</p></div><span class="stat-icon green">${icon('settings',19)}</span></div>
<form id="profileForm" class="setting-card"><h3 class="setting-title">Business profile</h3><p class="setting-desc">Shown in your app and included in JSON backups.</p><div class="field"><label for="businessName">BOOK / BUSINESS NAME</label><input id="businessName" name="businessName" maxlength="60" required value="${esc(prof.businessName||'My Hisab')}" placeholder="e.g. Royall Stores"></div><div class="field-grid"><div class="field"><label for="ownerName">YOUR NAME</label><input id="ownerName" name="ownerName" maxlength="60" value="${esc(prof.ownerName||'')}" placeholder="Optional"></div><div class="field"><label for="profilePhone">PHONE</label><input id="profilePhone" name="phone" type="tel" maxlength="20" value="${esc(prof.phone||'')}" placeholder="Optional"></div></div><div class="field"><label for="currency">CURRENCY</label><select id="currency" name="currency"><option value="INR" ${prof.currency==='INR'?'selected':''}>INR · Indian Rupee (₹)</option><option value="BDT" ${prof.currency==='BDT'?'selected':''}>BDT · Bangladeshi Taka (৳)</option><option value="USD" ${prof.currency==='USD'?'selected':''}>USD · US Dollar ($)</option><option value="GBP" ${prof.currency==='GBP'?'selected':''}>GBP · Pound Sterling (£)</option><option value="EUR" ${prof.currency==='EUR'?'selected':''}>EUR · Euro (€)</option></select></div><button class="primary-btn wide" type="submit">${icon('check',16)} Save profile</button></form>
<div class="setting-card"><h3 class="setting-title">JSON database & backup</h3><p class="setting-desc">Your data is saved locally in this browser as structured JSON. Export a backup before changing devices or clearing browser data.</p><button class="settings-action" data-action="export-json"><span class="setting-icon">${icon('download',17)}</span><span><strong>Export JSON backup</strong><small>Download all parties and entries</small></span><span class="chevron">${icon('arrow',16)}</span></button><button class="settings-action" data-action="import-json"><span class="setting-icon blue">${icon('upload',17)}</span><span><strong>Restore from JSON</strong><small>Replace this book with a backup file</small></span><span class="chevron">${icon('arrow',16)}</span></button><button class="settings-action" data-action="load-demo"><span class="setting-icon amber">${icon('sparkle',17)}</span><span><strong>Load sample data</strong><small>Try the app with clearly fictional records</small></span><span class="chevron">${icon('arrow',16)}</span></button></div>
<div class="setting-card"><h3 class="setting-title">Data management</h3><p class="setting-desc">These actions affect the data saved on this device.</p><button class="settings-action" data-action="clear-data"><span class="setting-icon red">${icon('trash',17)}</span><span><strong>Clear all ledger data</strong><small>Delete all parties and entries</small></span><span class="chevron">${icon('arrow',16)}</span></button></div>
<div class="setting-card"><div class="split"><span class="setting-title">Privacy by design</span><span class="pill green">${icon('shield',12)} Local only</span></div><p class="setting-desc" style="margin:8px 0 0">This standalone website does not send your ledger to a server. It uses browser local storage. Anyone with access to this browser profile may be able to access the data, so export backups and keep your device secure.</p></div><div class="footer-note">HisabBook · Version 1.0 · JSON ledger format v1</div>`}
function render(){const screen=$('#screen');if(selectedPartyId){screen.innerHTML=partyDetailHTML()}else{screen.innerHTML=activeTab==='home'?homeHTML():activeTab==='parties'?partiesHTML():activeTab==='reports'?reportsHTML():settingsHTML()}$('#bottomNav').innerHTML=navHTML();$('#fab').classList.toggle('hidden',activeTab==='settings'||!!selectedPartyId);$('#topSettings').innerHTML=icon('settings',18);$('#brandMark').innerHTML=icon('book',24);$('#fab').innerHTML=icon('plus',25);document.title=(db.profile.businessName||'My Hisab')+' · HisabBook';}
function toast(msg){const box=$('#toast');$('#toastMessage').textContent=msg;$('#toastIcon').innerHTML=icon('check',17);box.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>box.classList.remove('show'),2600)}
function openModal(html,state){modalState=state||{};$('#modalContent').innerHTML=`<div class="modal-handle"></div>${html}`;$('#modalOverlay').classList.remove('hidden');setTimeout(()=>{const focus=$('#modalContent input:not([type=hidden]),#modalContent select');if(focus)focus.focus({preventScroll:true})},80)}
function closeModal(){$('#modalOverlay').classList.add('hidden');modalState=null}
function openPartyForm(id){const p=id?partyById(id):null;const body=`<div class="modal-head"><div><h2>${p?'Edit party':'Add a party'}</h2><p>${p?'Update this account’s details.':'Create an account for a person or business.'}</p></div><button class="modal-close" type="button" data-action="close-modal">${icon('close',17)}</button></div><form id="partyForm"><input type="hidden" name="id" value="${esc(p?p.id:'')}"><div class="field"><label for="partyName">PARTY NAME *</label><input id="partyName" name="name" maxlength="80" required placeholder="Name or business" value="${esc(p?p.name:'')}"></div><div class="field-grid"><div class="field"><label for="partyPhone">PHONE (OPTIONAL)</label><input id="partyPhone" name="phone" type="tel" maxlength="24" placeholder="Phone number" value="${esc(p?p.phone||'':'')}"></div><div class="field"><label for="partyGroup">ACCOUNT TYPE</label><select name="group" id="partyGroup"><option value="customer" ${p&&p.group==='customer'?'selected':''}>Customer</option><option value="supplier" ${p&&p.group==='supplier'?'selected':''}>Supplier</option><option value="other" ${!p||p.group==='other'?'selected':''}>Other</option></select></div></div><div class="field"><label for="partyNotes">NOTES (OPTIONAL)</label><textarea id="partyNotes" name="notes" rows="2" maxlength="500" placeholder="Address or other details">${esc(p?p.notes||'':'')}</textarea></div>${p?'':`<div class="separator"></div><div class="field"><label for="openingAmount">OPENING BALANCE (OPTIONAL)</label><div class="amount-field"><span class="currency-prefix">${db.profile.currency==='INR'?'₹':db.profile.currency==='BDT'?'৳':db.profile.currency==='GBP'?'£':db.profile.currency==='EUR'?'€':'$'}</span><input id="openingAmount" name="openingAmount" type="number" min="0" step="0.01" placeholder="0.00" value=""></div></div><div class="field"><label for="openingType">OPENING BALANCE MEANS</label><select id="openingType" name="openingType"><option value="gave">They owe me (I gave)</option><option value="got">I owe them (I got)</option></select></div>`}<div class="modal-actions"><button class="secondary-btn" type="button" data-action="close-modal">Cancel</button><button class="primary-btn" type="submit">${icon('check',16)} ${p?'Save changes':'Create party'}</button></div></form>`;openModal(body,{kind:'party',id:id||null})}
function openEntryForm(type='gave',partyId=null){if(!db.parties.length&&!partyId){toast('Add a party before recording an entry.');openPartyForm();return}const opts=db.parties.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<option value="${esc(p.id)}" ${partyId===p.id?'selected':''}>${esc(p.name)}${p.phone?' · '+esc(p.phone):''}</option>`).join('');const body=`<div class="modal-head"><div><h2>New entry</h2><p>Record money given or received.</p></div><button class="modal-close" type="button" data-action="close-modal">${icon('close',17)}</button></div><form id="entryForm"><div class="type-switch"><button type="button" data-entry-type="gave" class="${type==='gave'?'active':''}">${icon('up',15)} You gave</button><button type="button" data-entry-type="got" class="${type==='got'?'active':''}">${icon('down',15)} You got</button></div><input type="hidden" name="type" id="entryType" value="${type}"><div class="field"><label for="entryParty">PARTY *</label><select name="partyId" id="entryParty" required><option value="">Choose an account</option>${opts}</select></div><div class="field"><label for="entryAmount">AMOUNT *</label><div class="amount-field"><span class="currency-prefix">${db.profile.currency==='INR'?'₹':db.profile.currency==='BDT'?'৳':db.profile.currency==='GBP'?'£':db.profile.currency==='EUR'?'€':'$'}</span><input id="entryAmount" name="amount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0.00" required></div></div><div class="field-grid"><div class="field"><label for="entryDate">DATE</label><input type="date" id="entryDate" name="date" value="${today()}" required></div><div class="field"><label for="entryMethod">PAYMENT MODE</label><select id="entryMethod" name="method"><option>Cash</option><option>UPI</option><option>Bank transfer</option><option>Card</option><option>Other</option></select></div></div><div class="field"><label for="entryNote">NOTE (OPTIONAL)</label><input id="entryNote" name="note" maxlength="200" placeholder="e.g. Grocery items, part payment"></div><div class="helper-note">${icon('shield',14)} “You gave” increases the party’s balance. “You got” reduces it. You can correct mistakes by deleting an entry from the ledger.</div><div class="modal-actions"><button class="secondary-btn" type="button" data-action="close-modal">Cancel</button><button class="primary-btn" type="submit">${icon('check',16)} Save entry</button></div></form>`;openModal(body,{kind:'entry',type,partyId})}
function saveParty(form){const fd=new FormData(form),name=String(fd.get('name')||'').trim();if(!name){toast('Enter a party name.');return}const id=String(fd.get('id')||'');if(id){const p=partyById(id);if(!p)return;p.name=name;p.phone=String(fd.get('phone')||'').trim();p.group=String(fd.get('group')||'other');p.notes=String(fd.get('notes')||'').trim();saveDB();closeModal();render();toast('Party details updated.');return}const p={id:uid(),name,phone:String(fd.get('phone')||'').trim(),group:String(fd.get('group')||'other'),notes:String(fd.get('notes')||'').trim(),createdAt:new Date().toISOString()};db.parties.push(p);const opening=moneyRaw(fd.get('openingAmount'));if(opening>0)db.transactions.push({id:uid(),partyId:p.id,type:String(fd.get('openingType')||'gave'),amount:opening,date:today(),note:'Opening balance',method:'Opening',createdAt:new Date().toISOString()});saveDB();closeModal();selectedPartyId=p.id;activeTab='parties';render();toast('Party added successfully.')}
function saveEntry(form){const fd=new FormData(form),partyId=String(fd.get('partyId')||''),amount=Number(fd.get('amount'));if(!partyById(partyId)){toast('Choose a valid party.');return}if(!Number.isFinite(amount)||amount<=0){toast('Enter an amount greater than zero.');return}const type=String(fd.get('type')||'gave');db.transactions.push({id:uid(),partyId,type:type==='got'?'got':'gave',amount:Math.round(amount*100)/100,date:String(fd.get('date')||today()),note:String(fd.get('note')||'').trim(),method:String(fd.get('method')||'Cash'),createdAt:new Date().toISOString()});saveDB();closeModal();if(!selectedPartyId)activeTab='home';render();toast('Entry saved to your ledger.')}
function exportJSON(){const payload={...db,exportedAt:new Date().toISOString(),app:'HisabBook',format:'hisabbook-json-v1'};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`hisabbook-backup-${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('JSON backup downloaded.')}
function validateBackup(x){return !!x&&Array.isArray(x.parties)&&Array.isArray(x.transactions)&&x.profile&&typeof x.profile==='object'&&x.parties.every(p=>p&&typeof p.id==='string'&&typeof p.name==='string')&&x.transactions.every(t=>t&&typeof t.id==='string'&&typeof t.partyId==='string'&&['gave','got'].includes(t.type)&&Number.isFinite(Number(t.amount))&&Number(t.amount)>0)}
function demoData(){const p1={id:uid(),name:'Aarav Sharma',phone:'98765 43210',group:'customer',notes:'Sample customer',createdAt:new Date().toISOString()};const p2={id:uid(),name:'Meera Stores',phone:'91234 56780',group:'supplier',notes:'Sample supplier',createdAt:new Date().toISOString()};const p3={id:uid(),name:'Rizwan Khan',phone:'',group:'other',notes:'Sample account',createdAt:new Date().toISOString()};const day=(off)=>{const d=new Date();d.setDate(d.getDate()+off);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const ts=[{id:uid(),partyId:p1.id,type:'gave',amount:2500,date:day(-3),note:'Grocery items',method:'UPI',createdAt:new Date().toISOString()},{id:uid(),partyId:p1.id,type:'got',amount:1000,date:day(-1),note:'Part payment',method:'Cash',createdAt:new Date().toISOString()},{id:uid(),partyId:p2.id,type:'got',amount:1800,date:day(-2),note:'Stock purchase',method:'Bank transfer',createdAt:new Date().toISOString()},{id:uid(),partyId:p3.id,type:'gave',amount:750,date:day(-5),note:'Advance',method:'Cash',createdAt:new Date().toISOString()},{id:uid(),partyId:p3.id,type:'got',amount:250,date:day(-1),note:'Paid back',method:'UPI',createdAt:new Date().toISOString()}];return {parties:[p1,p2,p3],transactions:ts}}
function shareText(p){const b=balanceFor(p.id),entries=txnsFor(p.id).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));return `${p.name} — Ledger summary\n${p.phone?'Phone: '+p.phone+'\n':''}Balance: ${fmt(Math.abs(b))} (${balanceLabel(b)})\nTotal you gave: ${fmt(totalGiven(p.id))}\nTotal you got: ${fmt(totalGot(p.id))}\nEntries: ${entries.length}\nGenerated by HisabBook`}
async function shareParty(id){const p=partyById(id);if(!p)return;const txt=shareText(p);try{if(navigator.share)await navigator.share({title:`${p.name} — Ledger summary`,text:txt});else if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(txt);toast('Ledger summary copied.')}else showTextModal(txt)}catch(e){if(e.name!=='AbortError')showTextModal(txt)}}
function showTextModal(txt){openModal(`<div class="modal-head"><div><h2>Ledger summary</h2><p>Copy this text to share outside the app.</p></div><button class="modal-close" data-action="close-modal">${icon('close',17)}</button></div><div class="field"><textarea id="shareText" rows="8" readonly>${esc(txt)}</textarea></div><button class="primary-btn wide" data-action="copy-summary">${icon('file',16)} Copy summary</button>`,{kind:'share',txt})}
function deleteTxn(id){const t=db.transactions.find(x=>x.id===id);if(!t)return;if(!confirm('Delete this ledger entry? The party balance will be recalculated.'))return;db.transactions=db.transactions.filter(x=>x.id!==id);saveDB();render();toast('Entry deleted and balance updated.')}
function deleteParty(id){const p=partyById(id);if(!p)return;if(!confirm(`Delete “${p.name}” and all ${txnsFor(id).length} related entries? This cannot be undone unless you have a JSON backup.`))return;db.parties=db.parties.filter(x=>x.id!==id);db.transactions=db.transactions.filter(x=>x.partyId!==id);selectedPartyId=null;activeTab='parties';saveDB();render();toast('Party and related entries deleted.')}
function clearAll(){if(!confirm('Clear all parties and ledger entries from this browser? Export a JSON backup first if you need these records.'))return;if(!confirm('This permanently removes the current local ledger. Continue?'))return;db=freshDB();saveDB();selectedPartyId=null;activeTab='home';partySearch='';partyFilter='all';render();toast('Ledger cleared.')}
function handleClick(e){const tab=e.target.closest('[data-tab]');if(tab){activeTab=tab.dataset.tab;selectedPartyId=null;render();return}const op=e.target.closest('[data-action]');if(op){const a=op.dataset.action;switch(a){case'go-settings':activeTab='settings';selectedPartyId=null;render();break;case'open-party':openPartyForm();break;case'edit-party':openPartyForm(op.dataset.id);break;case'open-entry':openEntryForm(op.dataset.type||'gave',op.dataset.party||selectedPartyId||null);break;case'close-modal':closeModal();break;case'back-parties':selectedPartyId=null;activeTab='parties';render();break;case'delete-txn':deleteTxn(op.dataset.id);break;case'delete-party':deleteParty(op.dataset.id);break;case'share-party':shareParty(op.dataset.id);break;case'export-json':exportJSON();break;case'import-json':$('#importFile').click();break;case'clear-data':clearAll();break;case'load-demo':{if((db.parties.length||db.transactions.length)&&!confirm('Replace your current ledger with sample data? Export a backup first if needed.'))break;const d=demoData();db.parties=d.parties;db.transactions=d.transactions;saveDB();activeTab='home';selectedPartyId=null;render();toast('Fictional sample data loaded.');break}case'clear-party-search':partySearch='';partyFilter='all';render();break;case'copy-summary':{const ta=$('#shareText');ta.select();try{document.execCommand('copy');toast('Summary copied.')}catch(e){toast('Select and copy the summary text.')}break}}return}
const party=e.target.closest('[data-open-party]');if(party){selectedPartyId=party.dataset.openParty;activeTab='parties';render();return}const filter=e.target.closest('[data-party-filter]');if(filter){partyFilter=filter.dataset.partyFilter;render();return}const report=e.target.closest('[data-report-period]');if(report){reportPeriod=report.dataset.reportPeriod;render();return}const type=e.target.closest('[data-entry-type]');if(type){const value=type.dataset.entryType;$('#entryType').value=value;$$('[data-entry-type]').forEach(b=>b.classList.toggle('active',b.dataset.entryType===value));return}}
document.addEventListener('click',handleClick);
document.addEventListener('submit',e=>{if(e.target.id==='partyForm'){e.preventDefault();saveParty(e.target)}else if(e.target.id==='entryForm'){e.preventDefault();saveEntry(e.target)}else if(e.target.id==='profileForm'){e.preventDefault();const fd=new FormData(e.target);db.profile.businessName=String(fd.get('businessName')||'My Hisab').trim()||'My Hisab';db.profile.ownerName=String(fd.get('ownerName')||'').trim();db.profile.phone=String(fd.get('phone')||'').trim();db.profile.currency=String(fd.get('currency')||'INR');saveDB();render();toast('Profile saved.')}});
document.addEventListener('input',e=>{if(e.target.id==='partySearch'){const el=e.target,st=el.selectionStart;partySearch=el.value;const main=$('#screen');const list=main.querySelector('.list');const summary=main.querySelector('.inline-summary');const search=el.value;const newHtml=partiesHTML();main.innerHTML=newHtml;const newInput=$('#partySearch');newInput.focus({preventScroll:true});try{newInput.setSelectionRange(st,st)}catch(err){}}});
$('#modalOverlay').addEventListener('click',e=>{if(e.target===$('#modalOverlay'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modalOverlay').classList.contains('hidden'))closeModal()});
$('#importFile').addEventListener('change',async e=>{const file=e.target.files&&e.target.files[0];if(!file)return;try{const parsed=JSON.parse(await file.text());if(!validateBackup(parsed))throw Error('This file does not look like a valid HisabBook JSON backup.');if(!confirm(`Restore ${parsed.parties.length} parties and ${parsed.transactions.length} entries? This will replace the ledger currently on this device.`))return;db={version:1,profile:{businessName:'My Hisab',ownerName:'',phone:'',currency:'INR',...(parsed.profile||{})},parties:parsed.parties,transactions:parsed.transactions,createdAt:parsed.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};const ids=new Set(db.parties.map(p=>p.id));db.transactions=db.transactions.filter(t=>ids.has(t.partyId));saveDB();selectedPartyId=null;activeTab='home';render();toast('JSON backup restored successfully.')}catch(err){alert(err.message||'Unable to read this JSON backup.')}finally{e.target.value=''}});
render();
})();
</script>
</body>
</html>
