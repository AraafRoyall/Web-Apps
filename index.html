<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7fbf9">
<title>Royall Web Apps</title>
<style>
:root{--bg:#f6faf8;--surface:#fff;--line:#dce9e3;--text:#18352b;--muted:#728980;--green:#18a66a;--teal:#0ea7a1;--amber:#e7a51c;--blue:#4388e8;--shadow:0 7px 24px rgba(22,72,53,.07)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}button{cursor:pointer}
.app{max-width:760px;margin:auto;min-height:100vh;padding:12px 12px 28px}
.top{display:flex;align-items:center;gap:11px;padding:6px 2px 17px}
.logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,var(--green),var(--teal));display:grid;place-items:center;color:#fff;font-weight:900;box-shadow:0 8px 20px rgba(14,167,161,.18)}
.brand{flex:1;min-width:0}.brand h1{margin:0;font-size:18px}.brand p{margin:3px 0 0;font-size:11px;color:var(--muted)}
.icon-btn{width:42px;height:42px;border:1px solid var(--line);background:#fff;border-radius:13px;color:var(--text)}
.hero{border:1px solid #d5ede2;background:linear-gradient(145deg,#e9f9f0,#effbf9);border-radius:23px;padding:19px;margin-bottom:16px;box-shadow:var(--shadow)}
.hero h2{margin:0;font-size:25px;letter-spacing:-.6px}.hero p{margin:7px 0 0;color:var(--muted);font-size:12px;line-height:1.45}
.search{margin-top:14px;position:relative}.search span{position:absolute;left:13px;top:9px;font-size:18px;color:var(--muted)}
.search input{width:100%;border:1px solid #cfe2da;background:#fff;border-radius:13px;padding:12px 13px 12px 39px;font-size:13px;color:var(--text);outline:none}
.search input:focus{border-color:#7bc7a5;box-shadow:0 0 0 3px rgba(24,166,106,.08)}
.section{margin-top:15px}.section-head{display:flex;align-items:end;justify-content:space-between;margin:0 2px 9px}
.section-title{font-size:14px;font-weight:850}.section-desc{font-size:10px;color:var(--muted);margin-top:2px}.count{font-size:10px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:16px;min-height:76px;padding:11px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;text-align:left;transition:transform .14s}
.chip:active{transform:scale(.985)}
.chip-icon{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-weight:900;font-size:12px;flex:none}
.chip-body{min-width:0;flex:1}.chip-name{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-desc{font-size:10px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.green{background:#e5f7ee;color:#14935b}.teal{background:#e4f7f6;color:#078b87}.amber{background:#fff4d9;color:#b47a00}.blue{background:#e8f1ff;color:#3778ca}
.empty{padding:22px;text-align:center;border:1px dashed #ccddd6;border-radius:15px;color:var(--muted);font-size:12px}
.loading{text-align:center;padding:40px 10px;color:var(--muted);font-size:12px}
.error{padding:18px;border:1px solid #efcdd1;background:#fff7f8;border-radius:15px;color:#a34d57;font-size:12px}
.footer{text-align:center;color:#94a69f;font-size:10px;padding:20px 0 4px}
@media(max-width:390px){.app{padding-left:10px;padding-right:10px}.chip{min-height:70px;padding:9px}.chip-icon{width:37px;height:37px}.chip-name{font-size:12px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="logo">R</div>
  <div class="brand"><h1 id="brandName">Royall Web Apps</h1><p id="brandDesc">Loading app catalog…</p></div>
  <button class="icon-btn" onclick="location.reload()">↻</button>
</header>

<section class="hero">
  <h2 id="heroTitle">Web Apps</h2>
  <p id="heroDesc">Loading the latest catalog from GitHub…</p>
  <div class="search"><span>⌕</span><input id="search" placeholder="Search apps..." autocomplete="off"></div>
</section>

<main id="content"><div class="loading">Loading apps…</div></main>
<div class="footer">AraafRoyall • Web-Apps</div>
</div>

<script>
const BUILD_URL="https://raw.githubusercontent.com/AraafRoyall/Web-Apps/main/build.json";
const COLORS=["green","teal","amber","blue"];
let data={top:[],groups:[]},allApps=[];

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));}
function appChip(app,index){
  const c=COLORS[Math.floor(index/2)%4];
  return `<button class="chip ${c}" onclick="location.href=${JSON.stringify(app.url)}">
    <div class="chip-icon ${c}">${esc(app.icon||"•")}</div>
    <div class="chip-body"><div class="chip-name">${esc(app.name)}</div><div class="chip-desc">${esc(app.description||"")}</div></div>
  </button>`;
}
function section(title,desc,items,startIndex){
  if(!items?.length)return "";
  return `<section class="section" data-title="${esc(title)}">
    <div class="section-head"><div><div class="section-title">${esc(title)}</div>${desc?`<div class="section-desc">${esc(desc)}</div>`:""}</div><div class="count">${items.length} app${items.length===1?"":"s"}</div></div>
    <div class="grid">${items.map((x,i)=>appChip(x,startIndex+i)).join("")}</div>
  </section>`;
}
function render(q=""){
  const s=q.trim().toLowerCase();
  let index=0,html="";
  const filter=items=>items.filter(x=>(x.name+" "+(x.description||"")).toLowerCase().includes(s));
  const top=filter(data.top||[]);
  html+=section("Top Apps","Quick access",top,index); index+=(data.top||[]).length;
  for(const g of (data.groups||[])){
    const items=filter(g.items||[]);
    html+=section(g.name,g.description,items,index);
    index+=(g.items||[]).length;
  }
  document.getElementById("content").innerHTML=html||`<div class="empty">No apps found.</div>`;
}
async function load(){
  try{
    const r=await fetch(BUILD_URL+"?v="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    data=await r.json();
    document.title=data.name||"Royall Web Apps";
    document.getElementById("brandName").textContent=data.name||"Royall Web Apps";
    document.getElementById("brandDesc").textContent="Live catalog from GitHub";
    document.getElementById("heroTitle").textContent=data.name||"Web Apps";
    document.getElementById("heroDesc").textContent=data.description||"Tools and utilities from AraafRoyall";
    render();
  }catch(e){
    document.getElementById("brandDesc").textContent="Catalog unavailable";
    document.getElementById("heroDesc").textContent="Could not load build.json from GitHub.";
    document.getElementById("content").innerHTML=`<div class="error">Unable to load the app catalog.<br><br>${esc(e.message)}</div>`;
  }
}
document.getElementById("search").addEventListener("input",e=>render(e.target.value));
load();
</script>
</body>
</html>
