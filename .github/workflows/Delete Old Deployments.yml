name: Cleanup GitHub Pages Deployments

on:
  workflow_dispatch:

permissions:
  deployments: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Keep latest 3 deployments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          echo "Fetching GitHub Pages deployments..."

          deployments=$(gh api \
            --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/deployments?environment=github-pages&per_page=100" \
            --jq '.[] | [.id, .created_at] | @tsv')

          count=0

          while IFS=$'\t' read -r id created; do
            [ -z "$id" ] && continue

            count=$((count + 1))

            if [ "$count" -le 3 ]; then
              echo "KEEP    #$id  $created"
              continue
            fi

            status=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$REPO/deployments/$id/statuses" \
              --jq '.[0].state // "unknown"')

            if [ "$status" = "inactive" ]; then
              echo "DELETE  #$id  $created"

              gh api \
                --method DELETE \
                -H "Accept: application/vnd.github+json" \
                "/repos/$REPO/deployments/$id"

            else
              echo "SKIP    #$id  $created  status=$status"
            fi

          done <<< "$deployments"

          echo "Cleanup complete."
